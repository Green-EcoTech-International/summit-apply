<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply | Africa AfCFTA &amp; Future of Work Summit 2026</title>
<meta name="description" content="Apply to sponsor, exhibit, speak, attend or showcase your business at the Africa AfCFTA & Future of Work Summit, Windhoek, 3 to 4 December 2026.">
<meta name="color-scheme" content="light">
<link rel="icon" href="assets/logo-geti.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e1b3a; --ink:#1c2740; --muted:#5b6780; --line:#dfe5f0; --bg:#f4f6fb; --card:#ffffff;
  --green:#1f9d4d; --green-dark:#14773a; --green-soft:#e6f5ec; --blue:#2f5be8; --blue-soft:#e9eefd;
  --amber:#f2a93b; --red:#c0392b; --red-soft:#fdecea; --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.strip{height:6px;background:linear-gradient(90deg,var(--green) 0 60%,var(--blue) 60% 100%)}
header.top{background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:14px;padding-top:16px;padding-bottom:16px;flex-wrap:wrap}
.logos{display:flex;align-items:center;gap:10px}
.logos img{height:56px;width:56px;object-fit:contain;border-radius:50%}
.logos img.heart{border-radius:8px}
.brand .t{flex:1;min-width:220px;border-left:1px solid var(--line);padding-left:14px}
.brand .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--green)}
.brand h1{margin:2px 0 0;font-size:20px;line-height:1.2;color:var(--navy)}
.date{text-align:right;margin-left:auto;font-weight:800;color:var(--navy);line-height:1.1}
.date span{display:block;color:var(--green);font-size:20px}
.date small{display:block;letter-spacing:.2em;font-size:11px;color:var(--muted);font-weight:700;margin-top:4px}
main.wrap{padding:24px 16px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 1px 2px rgba(14,27,58,.04)}
h2{margin:0 0 6px;font-size:24px;line-height:1.2;color:var(--navy)}
h3{margin:0 0 4px;font-size:17px;color:var(--navy)}
p{margin:0 0 12px}
.lead{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:15px}
.banner.warn{background:#fff7e6;border:1px solid #f4d9a3}
.banner.err{background:var(--red-soft);border:1px solid #f1b5ae;color:#7d2118}
.banner.info{background:var(--blue-soft);border:1px solid #c9d6fb}
/* progress */
.progress{display:flex;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.progress li{flex:1;font-size:12px;font-weight:600;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
.progress li.done{border-color:var(--green);color:var(--green-dark)}
.progress li.now{border-color:var(--blue);color:var(--navy)}
/* category cards */
.cats{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.cats{grid-template-columns:1fr 1fr}}
.cat{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;font:inherit;color:inherit}
.cat:hover{border-color:var(--blue)}
.cat:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #9db6ff;outline-offset:2px}
.cat .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--green-soft);color:var(--green-dark);display:grid;place-items:center;font-weight:800;font-size:18px}
.cat:nth-child(even) .ic{background:var(--blue-soft);color:var(--blue)}
.cat b{display:block;font-size:17px;color:var(--navy)}
.cat span.d{display:block;font-size:14px;color:var(--muted);margin-top:2px}
/* form */
fieldset{border:0;margin:0 0 18px;padding:0;min-width:0}
legend{padding:0;font-weight:600;margin-bottom:6px}
.field{margin-bottom:18px}
label.l,.field>.lab{display:block;font-weight:600;margin-bottom:6px}
.req{color:var(--red);margin-left:2px}
.opt{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid #c8d1e3;border-radius:10px;padding:11px 12px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.invalid input,.invalid select,.invalid textarea{border-color:var(--red)}
.msg{color:var(--red);font-size:13px;margin-top:5px;display:none;font-weight:500}
.invalid .msg{display:block}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:3px}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid #c8d1e3;border-radius:10px;cursor:pointer;background:#fff}
.choice input{margin-top:4px;flex:none;width:18px;height:18px;accent-color:var(--blue)}
.choice:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.two{display:grid;gap:0 16px;grid-template-columns:1fr}
@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}
.file{border:1.5px dashed #b4c0da;border-radius:10px;padding:12px;background:#fbfcff}
.file input{width:100%}
.file ul{margin:8px 0 0;padding-left:18px;font-size:14px}
/* packages */
.pkgs{display:grid;gap:12px}
.pkg{border:2px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
.pkg:has(input:checked){border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.pkg.full{opacity:.6}
.pkg label{display:flex;gap:12px;padding:14px;cursor:pointer;align-items:flex-start}
.pkg input{margin-top:5px;width:18px;height:18px;accent-color:var(--green);flex:none}
.pkg .tier{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--green-dark);text-transform:uppercase}
.pkg .nm{font-weight:700;color:var(--navy);font-size:17px}
.pkg .pr{font-weight:700;margin-left:auto;white-space:nowrap;padding-left:8px}
.pkg .top{display:flex;align-items:baseline;gap:6px;width:100%}
.pkg .av{font-size:12px;font-weight:600;margin-top:2px}
.pkg .av.low{color:#9a5b00}.pkg .av.none{color:var(--red)}
.pkg details{border-top:1px solid var(--line);padding:8px 14px 10px 44px;font-size:14px}
.pkg summary{cursor:pointer;color:var(--blue);font-weight:600}
.pkg ul{margin:8px 0 0;padding-left:18px}
.fixed{border:2px solid var(--green);background:var(--green-soft);border-radius:var(--radius);padding:14px}
/* review */
dl.sum{margin:0;display:grid;grid-template-columns:1fr;gap:0}
dl.sum div{padding:10px 0;border-bottom:1px solid var(--line)}
dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.consent{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin:18px 0}
.consent .notice{font-size:14px;color:var(--muted);margin-bottom:10px}
/* buttons */
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:12px 20px;border:2px solid transparent;cursor:pointer}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-dark)}
.btn.ghost{background:#fff;border-color:#c8d1e3;color:var(--navy)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ref{font-size:34px;font-weight:800;letter-spacing:.06em;color:var(--green-dark);background:var(--green-soft);border-radius:12px;padding:14px 18px;display:inline-block;margin:8px 0 14px}
ol.next{padding-left:20px}ol.next li{margin-bottom:6px}
footer.wrap{padding-bottom:40px;color:var(--muted);font-size:13px;text-align:center}
a{color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
@media print{header.top .date,.actions,.btn,footer,.progress{display:none}}
</style>
</head>
<body>
<div class="strip"></div>
<header class="top">
  <div class="wrap brand">
    <div class="logos">
      <img src="assets/logo-geti.jpg" alt="Green Ecotech International logo">
      <img class="heart" src="assets/logo-heart.jpg" alt="Summit logo">
    </div>
    <div class="t">
      <div class="eyebrow">Green Ecotech International presents</div>
      <h1 id="evName">Africa AfCFTA &amp; Future of Work Summit 2026</h1>
    </div>
    <div class="date"><span>3&ndash;4 Dec 2026</span><small>WINDHOEK</small></div>
  </div>
</header>

<main class="wrap" id="app">
  <noscript><div class="card">This application form needs JavaScript. Please enable it, or email <a href="mailto:getiwbgys@gmail.com">getiwbgys@gmail.com</a>.</div></noscript>
</main>
<footer class="wrap">
  <p>Trade &middot; Green technology &middot; AI &middot; Skills. Together for a Greener, Smarter and More Inclusive World.</p>
  <p>Questions? <a id="contactLink" href="mailto:getiwbgys@gmail.com">getiwbgys@gmail.com</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   CONFIGURATION: change things here, not further down.
   The key below is a PUBLISHABLE key. It is meant to be public; the
   database rules in setup.sql decide what it can do.
   ===================================================================== */
const CFG = {
  supabaseUrl: "https://ruqgwctsfjzruddcsekk.supabase.co",
  supabaseKey: "sb_publishable_1h0Th4UigMxt8FQsU3qzxw_srbR4zG5",
  eventName: "Africa AfCFTA & Future of Work Summit 2026",
  contactEmail: "getiwbgys@gmail.com",
  maxFileMB: 5,
  allowedTypes: ["image/png","image/jpeg","image/webp","application/pdf"],
  privacyNotice: "We collect the details you enter to assess your application, contact you about the Summit and, if you tick the second box, to send you Summit updates. They are seen only by the Summit organising team and reviewers, are not sold, and are kept only as long as needed to run the Summit and meet legal duties. You can ask to see, correct or delete your details at any time by emailing us.",
  mock: new URLSearchParams(location.search).get("mock") === "1" // for local testing only
};

const PILLARS = [
  "AfCFTA & regional trade","Women & youth enterprise","Green technology & climate innovation",
  "AI, data & digital transformation","Future-of-work skills & jobs","Partnerships & investment"
];

/* Packages copied from the Summit sponsorship brochure (prices in N$, excl. VAT). */
const PACKAGES = [
 {code:"continental",tier:"Headline partner",name:"AfCFTA Continental Partner",price:250000,
  benefits:["“Presented by” branding on all materials","10-minute address at the opening plenary","Seat on Panel 6: Partnerships & Investment","Premium 6×3 m stand + 10 VIP passes","Names the Summit Declaration & action plan","10 sponsored seats for women & youth MSMEs"]},
 {code:"green_horizon",tier:"Platinum",name:"Green Horizon Partner",price:150000,
  benefits:["Name Panel 3: Green Tech & Climate","5-minute address + panel seat","3×3 m exhibition space, 6 passes","Half-page programme advert"]},
 {code:"smart_futures",tier:"Gold",name:"Smart Futures Partner",price:90000,
  benefits:["Name Panel 4 (AI) or Panel 5 (Skills)","Speaking seat on your named panel","3×2 m exhibition space, 4 passes","Logo on stage backdrop & screens"]},
 {code:"inclusive_growth",tier:"Silver",name:"Inclusive Growth Partner",price:50000,
  benefits:["Name Panel 2: Women & Youth Enterprise","Present the Innovation Showcase award","Exhibition table, 3 passes","Logo in programme, website & screens"]},
 {code:"ubuntu",tier:"Bronze",name:"Ubuntu Champion",price:25000,
  benefits:["Fund 10 seats for young & women founders","Named thanks at the closing ceremony","2 delegate passes","Logo on website, screens & programme"]}
];
const EXHIBITOR = {code:"exhibitor",tier:"Exhibitor",name:"Trade Corridor Exhibitor",price:12500,
  benefits:["Exhibition table for both days","2 delegate passes","Programme & website listing"]};
const nad = n => "N$" + n.toLocaleString("en-US");

/* ---------- field definitions ---------- */
const ABOUT = [
 {k:"full_name",l:"Full name",t:"text",req:1,max:120,ac:"name"},
 {k:"email",l:"Email address",t:"email",req:1,max:254,ac:"email"},
 {k:"phone",l:"Phone or WhatsApp number",t:"tel",req:1,max:30,ac:"tel",hint:"Include the country code, e.g. +264 81 000 0000"},
 {k:"organisation",l:"Organisation or company",t:"text",max:150,reqFor:["sponsor","exhibitor"],ac:"organization"},
 {k:"job_title",l:"Your role or title",t:"text",max:100,ac:"organization-title"},
 {k:"country",l:"Country",t:"text",req:1,max:80,ac:"country-name"},
 {k:"website",l:"Website or LinkedIn",t:"text",max:200,hint:"Optional"}
];
const ORG_TYPES = ["Private company","Government or agency","Development partner or DFI","NGO or foundation","Media organisation","University or training institution","Other"];
const SECTORS = ["Agriculture & agro-processing","Green energy & climate","Technology & AI","Manufacturing & crafts","Trade & retail","Services","Education & skills","Health","Creative industries","Other"];

const CATS = {
 sponsor:{ic:"S",title:"Sponsor or partner",d:"Put your brand at the centre of trade, green innovation, AI and skills.",
  intro:"Tell us about your organisation and choose the package you are interested in. This is an expression of interest. We will send an agreement and invoice next; nothing is charged through this form.",
  fields:[
   {k:"package",t:"packages",l:"Choose a package",req:1},
   {k:"org_type",l:"Type of organisation",t:"select",opts:ORG_TYPES,req:1},
   {k:"partnership_type",l:"How would you like to partner?",t:"radio",req:1,opts:["Cash sponsorship at the package price","In-kind support (goods or services)","Media partnership","A custom arrangement"]},
   {k:"inkind_detail",l:"Describe what you can offer",t:"textarea",max:600,req:1,showIf:v=>v.partnership_type&&!v.partnership_type.startsWith("Cash")},
   {k:"objectives",l:"What do you hope to achieve by partnering with the Summit?",t:"textarea",max:800,req:1},
   {k:"interest_areas",l:"Which Summit pillars matter most to you?",t:"checks",opts:PILLARS,hint:"Optional"},
   {k:"logo",l:"Your logo",t:"file",hint:"Optional now. A high-resolution logo can be sent after the agreement is signed. PNG, JPG or PDF, up to 5 MB."},
   {k:"notes",l:"Anything else we should know?",t:"textarea",max:600}
  ]},
 exhibitor:{ic:"E",title:"Exhibitor",d:"Show your products and services in the Trade Corridor for both days.",
  intro:"The Trade Corridor Exhibitor place includes an exhibition table for both days and 2 delegate passes. This is an expression of interest; we will confirm availability and send an invoice.",
  fields:[
   {k:"package",t:"fixed",pkg:EXHIBITOR},
   {k:"exh_sector",l:"Main area of your business",t:"select",opts:["Trade & logistics","Green technology & climate","AI & digital","Skills & training","Manufacturing & agro-processing","Finance & investment","Other"],req:1},
   {k:"exh_offer",l:"What will you show or sell?",t:"textarea",max:600,req:1},
   {k:"exh_staff",l:"How many people will staff your table?",t:"select",opts:["1","2","3 or more"],req:1,hint:"2 delegate passes are included."},
   {k:"exh_power",l:"Do you need electricity at your table?",t:"radio",opts:["Yes","No"],req:1},
   {k:"exh_image",l:"A photo or brochure of your products",t:"file",hint:"Optional. PNG, JPG or PDF, up to 5 MB."},
   {k:"notes",l:"Anything else we should know?",t:"textarea",max:600}
  ]},
 founder:{ic:"F",title:"Women & youth founder",d:"Apply for a sponsored seat or the Innovation Showcase.",
  intro:"For women and young entrepreneurs running or starting a business. Sponsored places and the Innovation Showcase are limited, and our team reviews every application.",
  fields:[
   {k:"business_name",l:"Business name",t:"text",max:150,req:1},
   {k:"biz_sector",l:"Sector",t:"select",opts:SECTORS,req:1},
   {k:"biz_stage",l:"Stage of your business",t:"radio",req:1,opts:["Idea only","Started, not yet earning","Earning revenue","Growing or scaling"]},
   {k:"biz_years",l:"How long has it been operating?",t:"select",opts:["Not started yet","Less than 1 year","1 to 3 years","3 to 5 years","More than 5 years"],req:1},
   {k:"biz_team",l:"People working in the business",t:"select",opts:["Just me","2 to 5","6 to 10","More than 10"],req:1},
   {k:"biz_location",l:"Where is the business based?",t:"text",max:120,req:1},
   {k:"gender",l:"Gender",t:"select",opts:["Woman","Man","Prefer not to say"],hint:"Optional. Used only to check eligibility for women and youth places."},
   {k:"age_band",l:"Age group",t:"select",opts:["18 to 24","25 to 35","36 to 45","46 or older","Prefer not to say"],hint:"Optional. Used only to check eligibility for women and youth places."},
   {k:"apply_for",l:"What are you applying for?",t:"checks",req:1,opts:["A sponsored delegate seat","A place in the Innovation Showcase"]},
   {k:"pillar",l:"Which Summit pillar fits your business best?",t:"select",opts:PILLARS,req:1},
   {k:"pitch",l:"Describe your business and what it does",t:"textarea",max:1000,req:1},
   {k:"support_needed",l:"What support or connections would help you most at the Summit?",t:"textarea",max:600},
   {k:"deck",l:"Pitch deck or photo of your product",t:"file",hint:"Optional. PNG, JPG or PDF, up to 5 MB."}
  ]},
 speaker:{ic:"P",title:"Speaker or panelist",d:"Share your expertise on a Summit panel.",
  intro:"Tell us what you would speak about. Our programme team selects speakers to fit each session and will contact you if there is a match.",
  fields:[
   {k:"topic",l:"Proposed talk or panel topic",t:"text",max:150,req:1},
   {k:"pillar_pref",l:"Which session themes suit you?",t:"checks",opts:PILLARS,req:1},
   {k:"summary",l:"What would you say? Give the key points.",t:"textarea",max:800,req:1},
   {k:"bio",l:"Short biography",t:"textarea",max:800,req:1},
   {k:"speaking_exp",l:"Previous speaking experience or links",t:"textarea",max:400},
   {k:"travel",l:"Travel to Windhoek",t:"radio",req:1,opts:["I am based in Windhoek","I will cover my own travel","I would need travel support"]},
   {k:"headshot",l:"Headshot",t:"file",hint:"Optional. PNG or JPG, up to 5 MB."}
  ]},
 delegate:{ic:"D",title:"Delegate",d:"Attend the Summit as a participant.",
  intro:"Register your interest in attending. We will confirm your place by email.",
  fields:[
   {k:"attendee_type",l:"Which best describes you?",t:"select",req:1,opts:["Policymaker or regulator","MSME or entrepreneur","Investor or DFI","Employer or industry","TVET or university","Women or youth founder","Civil society or media","Other"]},
   {k:"days",l:"Which days will you attend?",t:"radio",req:1,opts:["Both days (3 and 4 December)","3 December only","4 December only"]},
   {k:"interest",l:"Which themes interest you most?",t:"checks",opts:PILLARS,hint:"Optional"},
   {k:"needs",l:"Accessibility or dietary needs",t:"textarea",max:300,hint:"Optional"},
   {k:"heard",l:"How did you hear about the Summit?",t:"select",opts:["Social media","Email","Partner organisation","Friend or colleague","Poster or QR code","Other"],hint:"Optional"}
  ]}
};

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeStore = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const STEPS = ["Category","About you","Your application","Review"];
const S = {step:0, cat:null, v:{}, files:{}, info:null, errors:{}, started:Date.now(), submitting:false, ref:null, err:""};

/* ---------- backend ---------- */
let sb = null;
if (!CFG.mock && window.supabase) {
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:false,autoRefreshToken:false}});
}
async function loadInfo(){
  if (CFG.mock) { S.info={closes_at:null,packages:[{code:"continental",capacity:1,taken:0},{code:"green_horizon",capacity:2,taken:1},{code:"smart_futures",capacity:3,taken:3},{code:"inclusive_growth",capacity:4,taken:0},{code:"ubuntu",capacity:null,taken:0},{code:"exhibitor",capacity:null,taken:0}]}; return; }
  try{
    if(!sb) throw new Error("no client");
    const {data,error}=await sb.rpc("form_info");
    if(error) throw error;
    S.info=data;
  }catch(e){ S.info={closes_at:null,packages:[],offline:true}; }
}
const pkgLeft = code => {
  const p=(S.info?.packages||[]).find(x=>x.code===code);
  if(!p||p.capacity==null) return {left:null,full:false};
  const left=Math.max(0,p.capacity-p.taken); return {left,full:left===0,cap:p.capacity};
};
const isClosed = () => S.info?.closes_at && Date.now() > Date.parse(S.info.closes_at);

/* ---------- draft autosave (text only) ---------- */
function saveDraft(){ safeStore.set("afw26-draft",JSON.stringify({cat:S.cat,v:S.v})); }
function loadDraft(){
  try{ const d=JSON.parse(safeStore.get("afw26-draft")||"null"); if(d&&d.cat&&CATS[d.cat]){S.cat=d.cat;S.v=d.v||{};return true;} }catch(e){}
  return false;
}

/* ---------- rendering ---------- */
function render(){
  const app=$("#app");
  if(S.ref) { app.innerHTML=renderDone(); app.focus?.(); window.scrollTo(0,0); return; }
  let h="";
  if(S.info?.offline) h+=`<div class="banner warn" role="status">We could not reach the application service just now. You can fill in the form, but submitting may fail. Please try again shortly or email <a href="mailto:${esc(CFG.contactEmail)}">${esc(CFG.contactEmail)}</a>.</div>`;
  if(isClosed()) { app.innerHTML=h+`<div class="card"><h2>Applications are closed</h2><p class="lead">Thank you for your interest. Please email <a href="mailto:${esc(CFG.contactEmail)}">${esc(CFG.contactEmail)}</a> if you have a question.</p></div>`; return; }
  h+=`<ol class="progress" aria-label="Progress">${STEPS.map((s,i)=>`<li class="${i<S.step?"done":i===S.step?"now":""}" ${i===S.step?'aria-current="step"':""}>${i+1}. ${s}</li>`).join("")}</ol><div class="card" id="panel" tabindex="-1">`;
  if(S.step===0) h+=renderCats();
  if(S.step===1) h+=renderFields("About you","We will use these details to contact you about your application.",ABOUT);
  if(S.step===2) h+=renderApplication();
  if(S.step===3) h+=renderReview();
  h+=`</div>`;
  app.innerHTML=h;
  bind();
}
function renderCats(){
  return `<h2>How would you like to take part?</h2><p class="lead">Choose the option that fits you best. You will see the questions for that option only.</p>
  <div class="cats">${Object.entries(CATS).map(([k,c])=>`<button type="button" class="cat" data-cat="${k}"><span class="ic" aria-hidden="true">${c.ic}</span><span><b>${esc(c.title)}</b><span class="d">${esc(c.d)}</span></span></button>`).join("")}</div>`;
}
function fieldHTML(f){
  const val=S.v[f.k], id="f_"+f.k, err=S.errors[f.k];
  const required=isReq(f), star=required?'<span class="req" aria-hidden="true">*</span>':"";
  const cls="field"+(err?" invalid":"");
  const msg=`<div class="msg" id="${id}_m" role="alert">${esc(err||"")}</div>`;
  const hint=f.hint?`<div class="hint" id="${id}_h">${esc(f.hint)}</div>`:"";
  const lab=`<label class="l" for="${id}">${esc(f.l)}${star}${!required&&!f.hint?'<span class="opt">(optional)</span>':""}</label>`;
  const desc=`aria-describedby="${id}_m${f.hint?" "+id+"_h":""}"`;
  if(f.t==="select") return `<div class="${cls}" data-k="${f.k}">${lab}<select id="${id}" name="${f.k}" ${desc} ${required?"required":""}><option value="">Select&hellip;</option>${f.opts.map(o=>`<option ${val===o?"selected":""}>${esc(o)}</option>`).join("")}</select>${hint}${msg}</div>`;
  if(f.t==="textarea") return `<div class="${cls}" data-k="${f.k}">${lab}<textarea id="${id}" name="${f.k}" maxlength="${f.max||1000}" ${desc}>${esc(val||"")}</textarea><div class="counter"><span data-c="${f.k}">${(val||"").length}</span> / ${f.max||1000}</div>${hint}${msg}</div>`;
  if(f.t==="radio") return `<div class="${cls}" data-k="${f.k}"><fieldset ${desc}><legend>${esc(f.l)}${star}</legend><div class="choices">${f.opts.map((o,i)=>`<label class="choice"><input type="radio" name="${f.k}" value="${esc(o)}" ${val===o?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div></fieldset>${hint}${msg}</div>`;
  if(f.t==="checks") return `<div class="${cls}" data-k="${f.k}"><fieldset ${desc}><legend>${esc(f.l)}${star}</legend><div class="choices">${f.opts.map(o=>`<label class="choice"><input type="checkbox" name="${f.k}" value="${esc(o)}" ${(val||[]).includes(o)?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div></fieldset>${hint}${msg}</div>`;
  if(f.t==="file"){ const fl=S.files[f.k]; return `<div class="${cls}" data-k="${f.k}"><label class="l" for="${id}">${esc(f.l)}${star}${!f.hint?'<span class="opt">(optional)</span>':""}</label><div class="file"><input type="file" id="${id}" name="${f.k}" accept="${CFG.allowedTypes.join(",")}" ${desc}>${fl?`<ul><li>${esc(fl.name)} (${(fl.size/1024).toFixed(0)} KB) <button type="button" class="btn ghost" data-rm="${f.k}" style="padding:2px 10px">Remove</button></li></ul>`:""}</div>${hint}${msg}</div>`; }
  if(f.t==="packages") return renderPackages(f,cls,msg);
  if(f.t==="fixed") return `<div class="field"><div class="fixed"><div class="pkg"><div style="padding:14px;border:0"><div class="tier">${esc(f.pkg.tier)}</div><div class="top"><span class="nm">${esc(f.pkg.name)}</span><span class="pr">${nad(f.pkg.price)}</span></div><ul>${f.pkg.benefits.map(b=>`<li>${esc(b)}</li>`).join("")}</ul><p class="hint">Prices exclude VAT.</p></div></div></div></div>`;
  return `<div class="${cls}" data-k="${f.k}">${lab}<input type="${f.t}" id="${id}" name="${f.k}" maxlength="${f.max||200}" value="${esc(val||"")}" ${f.ac?`autocomplete="${f.ac}"`:""} ${desc} ${required?"required":""}>${hint}${msg}</div>`;
}
function renderPackages(f,cls,msg){
  const val=S.v.package;
  return `<div class="${cls}" data-k="package"><fieldset aria-describedby="f_package_m"><legend>${esc(f.l)}<span class="req" aria-hidden="true">*</span></legend><div class="pkgs">${PACKAGES.map(p=>{
    const a=pkgLeft(p.code); const dis=a.full;
    const av=a.left==null?"":dis?`<div class="av none">All places taken</div>`:`<div class="av ${a.left<=1?"low":""}">${a.left} of ${a.cap} left</div>`;
    return `<div class="pkg ${dis?"full":""}"><label><input type="radio" name="package" value="${p.code}" ${val===p.code?"checked":""} ${dis?"disabled":""}><span style="flex:1"><span class="tier">${esc(p.tier)}</span><span class="top"><span class="nm">${esc(p.name)}</span><span class="pr">${nad(p.price)}</span></span>${av}</span></label><details><summary>What is included</summary><ul>${p.benefits.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></details></div>`;}).join("")}</div><p class="hint">Prices are in Namibian dollars and exclude VAT.</p></fieldset>${msg.replace('id="f_k_m"','')}</div>`;
}
function isReq(f){ return !!f.req || (f.reqFor&&f.reqFor.includes(S.cat)); }
function visible(f){ return !f.showIf || f.showIf(S.v); }
function renderFields(title,intro,fields){
  return `<h2>${esc(title)}</h2><p class="lead">${esc(intro)}</p>${S.cat?`<div class="banner info">Applying as: <b>${esc(CATS[S.cat].title)}</b> <button type="button" class="btn ghost" data-act="back0" style="padding:2px 10px;margin-left:6px">Change</button></div>`:""}
  <p class="hint"><span class="req">*</span> means required</p><div class="two">${fields.filter(visible).map(fieldHTML).join("")}</div>${nav()}`;
}
function renderApplication(){
  const c=CATS[S.cat];
  return `<h2>${esc(c.title)}</h2><p class="lead">${esc(c.intro)}</p><p class="hint"><span class="req">*</span> means required</p>${c.fields.filter(visible).map(fieldHTML).join("")}${nav()}`;
}
function nav(last){
  return `<div class="actions"><button type="button" class="btn ghost" data-act="back">Back</button><button type="button" class="btn primary" data-act="next">${last||"Continue"}</button></div>`;
}
function answerText(f){
  const v=S.v[f.k]; if(f.t==="file") return S.files[f.k]?S.files[f.k].name:"";
  if(f.t==="packages"||f.t==="fixed"){ const p=[...PACKAGES,EXHIBITOR].find(x=>x.code===(f.t==="fixed"?EXHIBITOR.code:v)); return p?`${p.name}, ${nad(p.price)} (excl. VAT)`:""; }
  return Array.isArray(v)?v.join(", "):(v||"");
}
function renderReview(){
  const c=CATS[S.cat];
  const rows=[...ABOUT.filter(visible),...c.fields.filter(visible)].map(f=>{const a=answerText(f);return a?`<div><dt>${esc(f.l||"Package")}</dt><dd>${esc(a)}</dd></div>`:"";}).join("");
  return `<h2>Review and submit</h2><p class="lead">Please check your answers. Use Back to change anything.</p>
  <div class="banner info">Applying as: <b>${esc(c.title)}</b></div>
  <dl class="sum">${rows}</dl>
  <div class="consent"><p class="notice"><b>How we use your information.</b> ${esc(CFG.privacyNotice)}</p>
   <div class="field ${S.errors.consent?"invalid":""}" style="margin:0 0 8px"><label class="choice"><input type="checkbox" id="consent" ${S.v.consent?"checked":""}><span>I agree that Green Ecotech International may store and use my details as described above. <span class="req">*</span></span></label><div class="msg" role="alert">${esc(S.errors.consent||"")}</div></div>
   <label class="choice"><input type="checkbox" id="marketing" ${S.v.marketing?"checked":""}><span>I would like to receive Summit updates by email. (Optional)</span></label></div>
  <div class="hp" aria-hidden="true"><label>Leave this empty<input type="text" id="hp" tabindex="-1" autocomplete="off"></label></div>
  ${S.err?`<div class="banner err" role="alert">${esc(S.err)}</div>`:""}
  <div class="actions"><button type="button" class="btn ghost" data-act="back" ${S.submitting?"disabled":""}>Back</button><button type="button" class="btn primary" data-act="submit" ${S.submitting?"disabled":""}>${S.submitting?"Submitting&hellip;":"Submit application"}</button></div>`;
}
function renderDone(){
  const sponsor=S.cat==="sponsor"||S.cat==="exhibitor";
  const next=sponsor?`<li>Our team reviews your interest and confirms package availability.</li><li>We email you a sponsorship agreement and invoice.</li><li>A 50% deposit secures your package, with the balance due by 20 November 2026.</li><li>You send your high-resolution logo and speaker details by 20 November 2026.</li>`
    :`<li>Our team reviews your application.</li><li>We will email you at the address you gave, quoting your reference number.</li>`;
  return `<div class="card"><h2>Thank you. Your application is in.</h2><p class="lead">Keep your reference number. Quote it in any message to us.</p>
  <div class="ref" id="refText">${esc(S.ref)}</div><div><button class="btn ghost" type="button" data-act="copy">Copy reference</button> <button class="btn ghost" type="button" data-act="print">Print</button></div>
  <h3 style="margin-top:20px">What happens next</h3><ol class="next">${next}</ol>
  <p class="hint">We do not send an automatic confirmation email yet, so please save or print this page. Questions? <a href="mailto:${esc(CFG.contactEmail)}">${esc(CFG.contactEmail)}</a></p>
  <div class="actions"><button class="btn primary" type="button" data-act="again">Submit another application</button></div></div>`;
}

/* ---------- events ---------- */
function bind(){
  const app=$("#app");
  app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ if(S.cat!==b.dataset.cat){S.v={};S.files={};} S.cat=b.dataset.cat; S.step=1; S.errors={}; saveDraft(); render(); focusPanel(); });
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act));
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{delete S.files[b.dataset.rm];render();});
  app.querySelectorAll("input[type=text],input[type=email],input[type=tel],select,textarea").forEach(el=>{
    if(!el.name) return;
    const h=()=>{ S.v[el.name]=el.value; if(el.tagName==="TEXTAREA"){const c=app.querySelector(`[data-c="${el.name}"]`); if(c)c.textContent=el.value.length;} saveDraft(); };
    el.addEventListener("input",h); el.addEventListener("change",()=>{h(); if(el.tagName==="SELECT"&&["partnership_type"].includes(el.name))render();});
  });
  app.querySelectorAll("input[type=radio][name]").forEach(el=>el.addEventListener("change",()=>{ S.v[el.name]=el.value; saveDraft(); if(el.name==="partnership_type") render(); }));
  app.querySelectorAll("input[type=checkbox][name]").forEach(el=>el.addEventListener("change",()=>{ S.v[el.name]=[...app.querySelectorAll(`input[name="${el.name}"]:checked`)].map(x=>x.value); saveDraft(); }));
  app.querySelectorAll("input[type=file]").forEach(el=>el.addEventListener("change",()=>{
    const f=el.files[0]; const box=el.closest("[data-k]"); const k=box.dataset.k;
    if(!f){return;}
    let e="";
    if(!CFG.allowedTypes.includes(f.type)) e="Please choose a PNG, JPG, WebP or PDF file.";
    else if(f.size>CFG.maxFileMB*1024*1024) e=`That file is larger than ${CFG.maxFileMB} MB.`;
    if(e){ S.errors[k]=e; el.value=""; box.classList.add("invalid"); box.querySelector(".msg").textContent=e; return; }
    delete S.errors[k]; S.files[k]=f; render();
  }));
  const c=$("#consent"); if(c) c.onchange=()=>{S.v.consent=c.checked;};
  const m=$("#marketing"); if(m) m.onchange=()=>{S.v.marketing=m.checked;};
}
function focusPanel(){ const p=$("#panel"); if(p){p.focus({preventScroll:true}); window.scrollTo({top:0,behavior:"smooth"});} }
function currentFields(){ return S.step===1?ABOUT:(S.step===2?CATS[S.cat].fields:[]); }
function validate(fields){
  S.errors={};
  for(const f of fields.filter(visible)){
    if(f.t==="fixed") continue;
    const v=S.v[f.k]; const empty = f.t==="file" ? !S.files[f.k] : (Array.isArray(v)?v.length===0:!String(v??"").trim());
    if(isReq(f) && empty){ S.errors[f.k]= f.t==="packages"?"Please choose a package.":"This field is required."; continue; }
    if(f.t==="email" && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.trim())) S.errors[f.k]="Please enter a valid email address.";
    if(f.k==="phone" && v && v.replace(/[^\d]/g,"").length<7) S.errors[f.k]="Please enter a valid phone number.";
    if(f.t==="packages" && v){ const a=pkgLeft(v); if(a.full) S.errors[f.k]="That package is no longer available."; }
  }
  return Object.keys(S.errors).length===0;
}
function showErrors(){
  render(); const first=document.querySelector(".invalid"); if(first){ first.scrollIntoView({block:"center",behavior:"smooth"}); const i=first.querySelector("input,select,textarea"); if(i) i.focus({preventScroll:true}); }
}
function act(a){
  if(a==="back0"){S.step=0;S.errors={};render();return;}
  if(a==="back"){ S.step=Math.max(0,S.step-1); S.errors={}; S.err=""; render(); focusPanel(); return; }
  if(a==="next"){ if(!validate(currentFields())){ showErrors(); return; } S.step++; S.errors={}; render(); focusPanel(); return; }
  if(a==="submit") submit();
  if(a==="copy"){ navigator.clipboard?.writeText(S.ref).then(()=>{const b=document.querySelector('[data-act="copy"]'); b.textContent="Copied";}).catch(()=>{}); }
  if(a==="print") window.print();
  if(a==="again"){ S.ref=null; S.cat=null; S.v={}; S.files={}; S.step=0; S.errors={}; S.err=""; S.started=Date.now(); safeStore.del("afw26-draft"); render(); }
}
const MESSAGES={closed:"Applications have closed.",package_full:"That package has just been taken. Please choose another.",bad_email:"Please check your email address.",no_consent:"Please tick the consent box.",too_many_files:"Too many files attached.",bad_file:"One of the files could not be accepted.",package_required:"Please choose a package.",bad_category:"Something went wrong. Please start again.",too_large:"Your answers are too long. Please shorten them."};
async function submit(){
  if(S.submitting) return;
  S.err="";
  if(!S.v.consent){ S.errors={consent:"Please tick this box to continue."}; render(); return; }
  S.errors={}; S.submitting=true; render();
  try{
    const id=(crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)}));
    const files=[]; let i=0;
    for(const [k,f] of Object.entries(S.files)){
      const nm=(i++)+"_"+f.name.replace(/[^A-Za-z0-9._-]/g,"_").slice(-120);
      if(!CFG.mock){
        const {error}=await sb.storage.from("uploads").upload(`${id}/${nm}`,f,{contentType:f.type,upsert:false});
        if(error) throw new Error("upload");
      }
      files.push({field:k,name:f.name,size:f.size,path:`${id}/${nm}`});
    }
    const c=CATS[S.cat]; const data={};
    for(const f of c.fields.filter(visible)){ if(["file","fixed","packages"].includes(f.t)) continue; const v=S.v[f.k]; if(v&&(!Array.isArray(v)||v.length)) data[f.k]=v; }
    for(const f of ABOUT){ if(["full_name","email","phone","organisation"].includes(f.k)) continue; if(S.v[f.k]) data[f.k]=S.v[f.k]; }
    const payload={category:S.cat,full_name:(S.v.full_name||"").trim(),email:(S.v.email||"").trim(),phone:(S.v.phone||"").trim(),organisation:(S.v.organisation||"").trim(),
      package_code:S.cat==="exhibitor"?"exhibitor":(S.cat==="sponsor"?S.v.package:null),data,files,consent:true,marketing_consent:!!S.v.marketing,
      hp:($("#hp")?.value)||"",elapsed_ms:Date.now()-S.started};
    let ref;
    if(CFG.mock){ await new Promise(r=>setTimeout(r,300)); ref="AFW26-MOCK01"; window.__lastPayload=payload; }
    else { const {data:r,error}=await sb.rpc("submit_application",{p:payload}); if(error) throw error; ref=r; }
    safeStore.del("afw26-draft"); S.ref=ref; S.submitting=false; render();
  }catch(e){
    S.submitting=false;
    const m=(e&&e.message)||"";
    const key=Object.keys(MESSAGES).find(k=>m.includes(k));
    S.err=key?MESSAGES[key]:(m==="upload"?"We could not upload your file. Check your connection and try again, or remove the file and continue.":"We could not send your application. Your answers are still here. Please check your connection and try again, or email "+CFG.contactEmail+".");
    render(); const b=document.querySelector(".banner.err"); if(b) b.scrollIntoView({block:"center"});
  }
}

/* ---------- start ---------- */
(async function(){
  $("#contactLink").textContent=CFG.contactEmail; $("#contactLink").href="mailto:"+CFG.contactEmail;
  await loadInfo();
  const q=new URLSearchParams(location.search);
  const want=q.get("category");
  if(want&&CATS[want]){ S.cat=want; S.step=1; if(want==="sponsor"&&PACKAGES.some(p=>p.code===q.get("package"))) S.v.package=q.get("package"); }
  else if(loadDraft()) S.step=1;
  render();
})();
</script>
</body>
</html>
